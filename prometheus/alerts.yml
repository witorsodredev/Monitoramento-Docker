groups:
  - name: host-alerts
    rules:
      - alert: HostMemoriaAlta
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memoria do host acima de 85%"
          description: "Uso de memoria em {{ $value | printf \"%.1f\" }}% por mais de 5 min (no de 8 GB)."

      - alert: HostCpuAlta
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU do host acima de 80%"
          description: "CPU sustentada em {{ $value | printf \"%.1f\" }}% por mais de 10 min (4 vCPU)."

      - alert: HostDiscoCheio
        expr: (1 - (node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{fstype!~\"tmpfs|overlay\"})) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disco acima de 85%"
          description: "Particao {{ $labels.mountpoint }} em {{ $value | printf \"%.1f\" }}%."

      - alert: HostSwapEmUso
        expr: (node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes) / node_memory_SwapTotal_bytes * 100 > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Swap em uso acima de 50%"
          description: "Swap em {{ $value | printf \"%.1f\" }}% - indicio de pressao de memoria."

  - name: container-alerts
    rules:
      - alert: ContainerDown
        expr: absent(container_last_seen) or (time() - container_last_seen{name!=\"\"} > 60)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Container sem metricas ha mais de 1 min"
          description: "Container {{ $labels.name }} parou de reportar (possivel crash/stop)."

      - alert: ContainerMemoriaAlta
        expr: (container_memory_usage_bytes{name!=\"\"} / container_spec_memory_limit_bytes{name!=\"\"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container perto do limite de memoria"
          description: "Container {{ $labels.name }} em {{ $value | printf \"%.1f\" }}% do limite (risco de OOMKill)."

      - alert: ContainerCpuAlta
        expr: (sum by (name) (rate(container_cpu_usage_seconds_total{name!=\"\"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container com CPU alta"
          description: "Container {{ $labels.name }} usando {{ $value | printf \"%.1f\" }}% de CPU."
