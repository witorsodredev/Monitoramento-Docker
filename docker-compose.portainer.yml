# Stack de monitoramento para Portainer (Podman) - SEM bind mount de arquivos.
# Todas as configs vao embutidas via `configs:` inline, entao pode colar
# direto no Web Editor do Portainer (Stacks > Add stack > Web editor).
#
# Dimensionado para no de 8 GB / 4 vCPU.

version: "3.8"

services:
  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=2GB"
      - "--web.enable-lifecycle"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_alerts
        target: /etc/prometheus/alerts.yml
    volumes:
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    mem_limit: 1g
    networks:
      - monitoring

  node-exporter:
    image: docker.io/prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    mem_limit: 128m
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/containers:/var/lib/containers:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "8080:8080"
    mem_limit: 256m
    networks:
      - monitoring

  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=changeme   # defina via Environment variables da stack no Portainer
      - GF_USERS_ALLOW_SIGN_UP=false
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/datasource.yml
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    mem_limit: 256m
    depends_on:
      - prometheus
    networks:
      - monitoring

configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
      rule_files:
        - /etc/prometheus/alerts.yml
      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]
        - job_name: node-exporter
          static_configs:
            - targets: ["node-exporter:9100"]
        - job_name: cadvisor
          static_configs:
            - targets: ["cadvisor:8080"]

  prometheus_alerts:
    content: |
      groups:
        - name: host-alerts
          rules:
            - alert: HostMemoriaAlta
              expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Memoria do host acima de 85%"
            - alert: HostCpuAlta
              expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "CPU do host acima de 80%"
            - alert: HostDiscoCheio
              expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) * 100 > 85
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Disco acima de 85%"
            - alert: HostSwapEmUso
              expr: (node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes) / node_memory_SwapTotal_bytes * 100 > 50
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Swap em uso acima de 50%"
        - name: container-alerts
          rules:
            - alert: ContainerDown
              expr: time() - container_last_seen{name!=""} > 60
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "Container sem metricas ha mais de 1 min"
            - alert: ContainerMemoriaAlta
              expr: (container_memory_usage_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""}) * 100 > 85
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Container perto do limite de memoria (risco de OOMKill)"
            - alert: ContainerCpuAlta
              expr: (sum by (name) (rate(container_cpu_usage_seconds_total{name!=""}[5m])) * 100) > 80
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Container com CPU alta"

  grafana_datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          editable: true

volumes:
  prometheus-data:
  grafana-data:

networks:
  monitoring:
    driver: bridge
